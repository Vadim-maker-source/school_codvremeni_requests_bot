server {
    listen 80;
    server_name 152.234.209.198;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/requestsbotweb-acme;
        default_type text/plain;
    }
    location / { return 308 https://152.234.209.198$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name 152.234.209.198;
    ssl_certificate /opt/requestsbotweb/tls/live/requestsbotweb-ip/fullchain.pem;
    ssl_certificate_key /opt/requestsbotweb/tls/live/requestsbotweb-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_hide_header X-Powered-By;
    }
}
